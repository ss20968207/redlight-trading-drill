<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔羅占卜 · 三張牌問事</title>
<meta name="description" content="輸入你的問題，抽三張塔羅牌（過去／現在／未來），純前端規則庫即時解牌，不需要後端或帳號。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1a1d;
    --panel: #252226;
    --panel-2: #2c282c;
    --screen: #14120f;
    --border: #3d383a;
    --border-soft: #332f32;
    --text: #f2efe9;
    --muted: #9c948f;
    --muted-2: #6f6a68;
    --red: #e2483d;
    --green: #3fae58;
    --green-soft: rgba(63, 174, 88, 0.14);
    --amber: #e8a33d;
    --amber-dim: #8a5f22;
    --purple: #9b7fd4;
    --purple-soft: rgba(155, 127, 212, 0.14);
    --purple-dim: #5a4a86;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(155, 127, 212, 0.08), transparent),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px 16px 64px;
    min-height: 100vh;
  }

  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: "Cinzel", "Noto Sans TC", serif; letter-spacing: 0.03em; }

  .wrap { max-width: 560px; margin: 0 auto; }

  .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--muted-2); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--purple); }

  .housing {
    background: linear-gradient(180deg, var(--panel) 0%, #201d20 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 -1px 0 rgba(0,0,0,0.5) inset,
      0 24px 60px -20px rgba(0,0,0,0.7),
      0 4px 16px rgba(0,0,0,0.4);
    padding: 22px;
    position: relative;
  }
  .housing::before, .housing::after, .housing .rivet-tr, .housing .rivet-bl {
    content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: #0f0d0f; box-shadow: 0 1px 0 rgba(255,255,255,0.08);
  }
  .housing::before { top: 11px; left: 11px; }
  .housing::after { bottom: 11px; right: 11px; }
  .housing .rivet-tr { top: 11px; right: 11px; }
  .housing .rivet-bl { bottom: 11px; left: 11px; }

  h1.title {
    text-align: center; font-family: "Cinzel", serif; font-weight: 700; font-size: 26px;
    letter-spacing: 0.04em; text-wrap: balance; margin: 4px 0 6px; color: var(--text);
  }
  p.subtitle {
    text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.6;
    margin: 0 0 22px; max-width: 420px; margin-left: auto; margin-right: auto;
  }

  .section-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .section { margin-bottom: 20px; }

  textarea.q-input {
    width: 100%; resize: vertical; min-height: 64px;
    background: var(--screen); border: 1px solid var(--border-soft); border-radius: 8px;
    color: var(--text); font-family: "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.6;
    padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.5) inset;
  }
  textarea.q-input::placeholder { color: var(--muted-2); }
  textarea.q-input:focus { outline: none; border-color: var(--purple); }

  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice-btn {
    flex: 1; min-width: 78px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 10px 8px; color: var(--muted); font-weight: 700; font-size: 13px;
    cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.35); transition: all 0.1s ease; text-align: center;
  }
  .choice-btn:hover { color: var(--text); }
  .choice-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  .choice-btn.active { background: var(--purple-soft); border-color: var(--purple); color: var(--purple); }

  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #b199e6, var(--purple));
    color: #1c1730; font-weight: 700; font-size: 14px;
    border: 1px solid var(--purple-dim); border-radius: 8px; padding: 11px 22px;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 3px 0 var(--purple-dim), 0 6px 14px rgba(155,127,212,0.25);
    transition: transform 0.08s ease; width: 100%;
  }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 1px 0 var(--purple-dim); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--panel-2); color: var(--muted); font-weight: 700; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; cursor: pointer; width: 100%;
  }
  .btn-ghost:hover { color: var(--text); }

  .btn-row { display: flex; justify-content: center; margin-top: 4px; gap: 10px; }

  /* --- card spread --- */
  .spread { display: flex; gap: 10px; justify-content: center; margin: 6px 0 18px; }
  .card-slot { flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .card-pos-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-2); font-weight: 700; }

  .card-flip {
    width: 100%; aspect-ratio: 2/3; perspective: 900px; cursor: pointer;
  }
  .card-flip .card-inner {
    position: relative; width: 100%; height: 100%; transition: transform 0.55s cubic-bezier(.2,.7,.3,1);
    transform-style: preserve-3d;
  }
  .card-flip.flipped .card-inner { transform: rotateY(180deg); }
  .card-flip.flipped { cursor: default; }
  .card-face {
    position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(0,0,0,0.45);
  }
  .card-back {
    background:
      repeating-linear-gradient(45deg, rgba(155,127,212,0.14) 0px, rgba(155,127,212,0.14) 2px, transparent 2px, transparent 10px),
      linear-gradient(160deg, #2c2540, #1a1622);
    border-color: var(--purple-dim);
  }
  .card-back .glyph { font-size: 26px; color: var(--purple); opacity: 0.85; }
  .card-front {
    background: linear-gradient(160deg, var(--panel-2), #211e22);
    transform: rotateY(180deg); padding: 8px; text-align: center; gap: 4px;
  }
  .card-front.reversed .card-front-inner { transform: rotate(180deg); }
  .card-front-inner { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .card-front .arcana-no { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--muted-2); }
  .card-front .card-name { font-family: "Cinzel", serif; font-weight: 700; font-size: 13px; color: var(--text); line-height: 1.3; padding: 0 4px; }
  .card-front .card-suit-icon { font-size: 20px; }
  .card-orientation { font-size: 10px; margin-top: 4px; font-weight: 700; letter-spacing: 0.05em; }
  .card-orientation.up { color: var(--green); }
  .card-orientation.rev { color: var(--red); }

  .hint-text { text-align: center; font-size: 12px; color: var(--muted-2); margin-bottom: 14px; }

  /* --- reading --- */
  .reading { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .reading-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 15px;
    opacity: 0; transform: translateY(6px); animation: fadeIn 0.4s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  .reading-card .rc-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .reading-card .rc-pos { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--purple); }
  .reading-card .rc-name { font-family: "Cinzel", serif; font-weight: 700; font-size: 14.5px; color: var(--text); }
  .reading-card .rc-orient { font-size: 11px; font-weight: 700; }
  .reading-card .rc-orient.up { color: var(--green); }
  .reading-card .rc-orient.rev { color: var(--red); }
  .reading-card p { margin: 0; font-size: 13.5px; line-height: 1.7; color: #d8d4cd; }

  .callout {
    border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; font-size: 13px; line-height: 1.7;
    background: var(--purple-soft); border: 1px solid rgba(155,127,212,0.4);
    opacity: 0; animation: fadeIn 0.4s ease forwards; animation-delay: 0.15s;
  }
  .callout .headline { color: var(--purple); font-weight: 700; margin-bottom: 4px; display: block; }

  .footer-note { text-align: center; font-size: 11px; color: var(--muted-2); margin-top: 28px; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

    <span class="rivet-tr"></span><span class="rivet-bl"></span>
  </div>

</div>

    ["戰車", "The Chariot", "堅定意志、掌控方向、突破前進", "失去方向、內耗嚴重、缺乏紀律"],
    ["力量", "Strength", "溫柔而堅定、內在勇氣、馴服恐懼", "自我懷疑、力不從心、情緒失控"],
    ["隱者", "The Hermit", "獨處反思、向內尋找答案、耐心等待", "過度孤立、逃避現實、迷失自我"],
    ["命運之輪", "Wheel of Fortune", "轉機出現、循環流動、順勢而為", "陷入逆境、失控的變化、抗拒改變"],
    ["正義", "Justice", "公平清晰、因果分明、理性判斷", "遭遇不公、逃避責任、判斷失準"],
    ["倒吊人", "The Hanged Man", "換個角度看事情、暫停等待、放下執著", "停滯不前、抗拒犧牲、原地打轉"],

    ["節制", "Temperance", "平衡調和、耐心整合、走中庸之道", "失去平衡、過度或不足、事事急躁"],
    ["惡魔", "The Devil", "受困於慾望、自我設限、看不見的束縛", "掙脫束縛、覺察誘惑、重獲自由"],
    ["塔", "The Tower", "劇烈變動、既有秩序崩解、突如其來的真相", "逃避崩塌、危機被延遲、內在動盪不安"],
    ["星星", "The Star", "重新燃起希望、療癒、對未來有信心", "失去信心、理想落空、灰心喪志"],
    ["月亮", "The Moon", "潛意識浮動、不確定感、幻覺與隱藏的恐懼", "迷霧漸漸散去、真相浮現、走出焦慮"],
    ["太陽", "The Sun", "成功喜悅、活力充沛、事情變得清晰", "過度樂觀、光芒暫時受阻、自信不足"],
    ["審判", "Judgement", "覺醒時刻、階段總結、重要的召喚", "自我否定、猶豫不決、逃避該面對的覺察"],
    ["世界", "The World", "圓滿完成、整合所有努力、階段性成就", "還有未竟之事、缺乏收尾、原地停滯"]
  ];

  var SUITS = [
    { key: "wands", name: "權杖", icon: "🔥", domain: "行動與事業" },
    { key: "cups", name: "聖杯", icon: "💧", domain: "情感與關係" },
    { key: "swords", name: "寶劍", icon: "⚔", domain: "思考與人際磨合" },
    { key: "pentacles", name: "錢幣", icon: "◆", domain: "金錢與現實生活" }
  ];

  var RANKS = [
    { label: "首牌", up: "全新的機會與源頭能量正在啟動", down: "起步猶豫，能量還沒真正發動" },
    { label: "二", up: "面對抉擇，需要在兩者間找到平衡", down: "選擇困難、猶豫不決或關係失衡" },
    { label: "三", up: "初步成果顯現，協作與成長正在展開", down: "合作出現裂縫，成果比預期慢" },
    { label: "四", up: "帶來暫時的安定，可以喘口氣休息", down: "安逸變成停滯，該動卻按兵不動" },
    { label: "五", up: "出現摩擦、競爭或失衡，需要面對衝突", down: "衝突延燒或內耗加劇，需要先冷靜" },
    { label: "六", up: "透過付出、分享與修復帶來和解", down: "付出不對等，或活在過去無法放下" },
    { label: "七", up: "需要耐心評估、堅持下去才能看到成果", down: "信心不足、想放棄，或評估過於悲觀" },

  var COURTS = [

  function buildDeck() {
    var deck = [];
    MAJOR.forEach(function (m, i) {
      deck.push({
        id: "m" + i,
        name: m[0],
        nameEn: m[1],
        icon: "✦",
        up: m[2],
        down: m[3]

          nameEn: suit.key + " " + court.label,

    { key: "present", label: "現在", verb: "落在「現在」" },
    { key: "future", label: "未來", verb: "指向「未來」" }

    "有一張逆位牌，提醒你留意其中一個環節被卡住或被忽略的部分，調整之後整體仍是往好的方向走。",
    "兩張逆位牌顯示目前阻力不小，建議先處理內在的猶豫或外在的卡點，再談下一步的行動。",
    "三張都是逆位，這是一個提醒：現在不是急著往前衝的時機，先誠實面對問題的根源，會比硬撐更有幫助。"
  ];

  // ---------------------------------------------------------------------
  // Random helpers
  // ---------------------------------------------------------------------

  function shuffle(items) {
    var arr = items.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function drawThree() {
    var shuffled = shuffle(DECK);
    return shuffled.slice(0, 3).map(function (card) {
      return { card: card, reversed: Math.random() < 0.5 };
    });
  }

  // ---------------------------------------------------------------------
  // State + render
  // ---------------------------------------------------------------------

  var state = {
    screen: "intro", // intro | drawn
    category: "general",
    question: "",
    draws: null,
    flipped: [false, false, false]
  };

  var app = document.getElementById("app");

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function render() {
    app.innerHTML = '<span class="rivet-tr"></span><span class="rivet-bl"></span>';
    if (state.screen === "intro") renderIntro();
    else renderDrawn();
  }

  function renderIntro() {
    var title = el("h1", { class: "title display" }, [document.createTextNode("塔羅占卜")]);
    var subtitle = el("p", { class: "subtitle" }, [
      document.createTextNode("先想好一個困擾你的問題，選一個最相關的主題，然後抽三張牌，分別對應這件事的過去、現在、未來。")
    ]);

    var catLabel = el("div", { class: "section-label" }, [document.createTextNode("這個問題主要跟什麼有關？")]);
    var catRow = el("div", { class: "choice-row" });
    CATEGORIES.forEach(function (c) {
      var btn = el("button", {
        class: "choice-btn" + (state.category === c.key ? " active" : ""),
        type: "button",
        onclick: function () { state.category = c.key; render(); }
      }, [document.createTextNode(c.label)]);
      catRow.appendChild(btn);
    });
    var catSection = el("div", { class: "section" }, [catLabel, catRow]);

    var qLabel = el("div", { class: "section-label" }, [document.createTextNode("你想問的問題（選填，但建議寫下來）")]);
    var qInput = el("textarea", {
      class: "q-input",
      placeholder: "例如：我該不該接受這個新的工作機會？",
      oninput: function (e) { state.question = e.target.value; }
    });
    qInput.value = state.question;
    var qSection = el("div", { class: "section" }, [qLabel, qInput]);

    var drawBtn = el("button", {
      class: "btn-primary",
      type: "button",
      onclick: function () {
        state.draws = drawThree();
        state.flipped = [false, false, false];
        state.screen = "drawn";
        render();
      }
    }, [document.createTextNode("洗牌，抽三張牌")]);
    var btnRow = el("div", { class: "btn-row" }, [drawBtn]);

    app.appendChild(title);
    app.appendChild(subtitle);
    app.appendChild(catSection);
    app.appendChild(qSection);
    app.appendChild(btnRow);
  }

  function renderDrawn() {
    var catObj = CATEGORIES.filter(function (c) { return c.key === state.category; })[0];
    var title = el("h1", { class: "title display" }, [document.createTextNode("你的三張牌")]);
    var subtitle = el("p", { class: "subtitle" }, [
      document.createTextNode(
        (state.question ? "問題：" + state.question + "　·　" : "") + "主題：" + catObj.label + "　·　點卡牌翻開"
      )
    ]);

    var spread = el("div", { class: "spread" });
    POSITIONS.forEach(function (pos, i) {
      var draw = state.draws[i];
      var flipped = state.flipped[i];

      var inner = el("div", { class: "card-inner" });
      var back = el("div", { class: "card-face card-back" }, [el("span", { class: "glyph" }, [document.createTextNode("✦")])]);
      var frontInner = el("div", { class: "card-front-inner" }, [
        el("span", { class: "arcana-no mono" }, [document.createTextNode(draw.card.icon)]),
        el("span", { class: "card-name" }, [document.createTextNode(draw.card.name)]),
        el("span", { class: "card-orientation " + (draw.reversed ? "rev" : "up") }, [document.createTextNode(draw.reversed ? "逆位" : "正位")])
      ]);
      var front = el("div", { class: "card-face card-front" + (draw.reversed ? " reversed" : "") }, [frontInner]);

      inner.appendChild(back);
      inner.appendChild(front);

      var flip = el("div", { class: "card-flip" + (flipped ? " flipped" : "") }, [inner]);
      if (!flipped) {
        flip.addEventListener("click", function () {
          state.flipped[i] = true;
          render();
        });
      }

      var slot = el("div", { class: "card-slot" }, [
        el("div", { class: "card-pos-label" }, [document.createTextNode(pos.label)]),
        flip
      ]);
      spread.appendChild(slot);
    });

    app.appendChild(title);
    app.appendChild(subtitle);
    app.appendChild(spread);

    var allFlipped = state.flipped.every(Boolean);
    if (!allFlipped) {
      app.appendChild(el("p", { class: "hint-text" }, [document.createTextNode("依序點開三張牌，查看完整解讀")]));
    } else {
      app.appendChild(buildReading());
    }

    var resetBtn = el("button", {
      class: "btn-ghost",
      type: "button",
      onclick: function () {
        state.screen = "intro";
        state.draws = null;
        render();
      }
    }, [document.createTextNode("重新占卜")]);
    app.appendChild(el("div", { class: "btn-row" }, [resetBtn]));
  }

  function buildReading() {
    var wrap = el("div");
    var reading = el("div", { class: "reading" });

    var reversedCount = 0;
    POSITIONS.forEach(function (pos, i) {
      var draw = state.draws[i];
      if (draw.reversed) reversedCount++;
      var meaning = draw.reversed ? draw.card.down : draw.card.up;
      var clause = CATEGORY_CLAUSE[state.category][pos.key];

      var head = el("div", { class: "rc-head" }, [
        el("span", { class: "rc-pos" }, [document.createTextNode(pos.label)]),
        el("span", { class: "rc-name display" }, [document.createTextNode(draw.card.name)]),
        el("span", { class: "rc-orient " + (draw.reversed ? "rev" : "up") }, [document.createTextNode(draw.reversed ? "逆位" : "正位")])
      ]);
      var text = "《" + draw.card.name + "》" + pos.verb + "——" + meaning + "。" + clause;
      var card = el("div", { class: "reading-card", style: "animation-delay:" + (i * 0.1) + "s" }, [
        head, el("p", {}, [document.createTextNode(text)])
      ]);
      reading.appendChild(card);
    });

    wrap.appendChild(reading);
    wrap.appendChild(el("div", { class: "callout" }, [
      el("span", { class: "headline" }, [document.createTextNode("整體提示")]),
      el("p", {}, [document.createTextNode(OVERALL_BY_REVERSED_COUNT[reversedCount])])
    ]));
    return wrap;
  }

  render();
})();
</script>
</body>
</html>
