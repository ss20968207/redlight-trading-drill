<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指標交易訓練所</title>
<meta name="description" content="看兩根K棒猜第三根漲跌，練習紅綠燈搭配 3+1／馬刺訊號背後的判斷力。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1a1d;
    --panel: #252226;
    --panel-2: #2c282c;
    --screen: #14120f;
    --border: #3d383a;
    --border-soft: #332f32;
    --text: #f2efe9;
    --muted: #9c948f;
    --muted-2: #6f6a68;
    --red: #e2483d;
    --red-soft: rgba(226, 72, 61, 0.14);
    --green: #3fae58;
    --green-soft: rgba(63, 174, 88, 0.14);
    --amber: #e8a33d;
    --amber-dim: #8a5f22;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232, 163, 61, 0.06), transparent),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px 16px 64px;
    min-height: 100vh;
  }

  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: "Big Shoulders Display", "Noto Sans TC", sans-serif; }

  .wrap { max-width: 560px; margin: 0 auto; }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted-2);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .topbar .eyebrow { margin-bottom: 0; }
  .ig-watermark { font-size: 11px; letter-spacing: 0.03em; color: var(--muted-2); user-select: none; }

  .housing {
    background: linear-gradient(180deg, var(--panel) 0%, #201d20 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 -1px 0 rgba(0,0,0,0.5) inset,
      0 24px 60px -20px rgba(0,0,0,0.7),
      0 4px 16px rgba(0,0,0,0.4);
    padding: 22px;
    position: relative;
  }

  /* corner rivets, a small physical-hardware detail */
  .housing::before, .housing::after,
  .housing .rivet-tr, .housing .rivet-bl {
    content: "";
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #0f0d0f;
    box-shadow: 0 1px 0 rgba(255,255,255,0.08);
  }
  .housing::before { top: 11px; left: 11px; }
  .housing::after { bottom: 11px; right: 11px; }
  .housing .rivet-tr { top: 11px; right: 11px; }
  .housing .rivet-bl { bottom: 11px; left: 11px; }

  .lamp-row { display: flex; justify-content: center; gap: 18px; padding: 4px 0 18px; }
  .lamp {
    width: 30px; height: 30px; border-radius: 50%;
    background: #0f0d0f;
    border: 1px solid #050405;
    box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 2px 5px rgba(0,0,0,0.5);
    position: relative;
  }
  .lamp.lit-red { background: radial-gradient(circle at 35% 30%, #ff8a7e, var(--red) 55%, #8f1f17 100%); box-shadow: 0 0 16px 3px rgba(226,72,61,0.65), 0 1px 0 rgba(255,255,255,0.15) inset; }
  .lamp.lit-green { background: radial-gradient(circle at 35% 30%, #a3f0b6, var(--green) 55%, #1f6b34 100%); box-shadow: 0 0 16px 3px rgba(63,174,88,0.65), 0 1px 0 rgba(255,255,255,0.15) inset; }
  .lamp.lit-amber { background: radial-gradient(circle at 35% 30%, #ffd88f, var(--amber) 55%, #96631c 100%); box-shadow: 0 0 14px 3px rgba(232,163,61,0.55), 0 1px 0 rgba(255,255,255,0.15) inset; }

  h1.title {
    text-align: center;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.02em;
    text-wrap: balance;
    margin: 0 0 4px;
    color: var(--text);
  }
  p.subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0 0 22px;
    max-width: 420px;
    margin-left: auto; margin-right: auto;
  }

  .rules { display: flex; flex-direction: column; gap: 10px; margin: 0 0 20px; }
  .rule { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.65; color: #d8d4cd; }
  .rule .num {
    flex: none; width: 20px; height: 20px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--amber); font-family: "JetBrains Mono", monospace; font-size: 11px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .rule b.long { color: var(--green); }
  .rule b.short { color: var(--red); }

  .disclaimer { font-size: 11px; color: var(--muted-2); line-height: 1.6; margin: 14px 0; }

  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #f0b45a, var(--amber));
    color: #241a08;
    font-weight: 700; font-size: 14px;
    border: 1px solid #b87a1f;
    border-radius: 8px;
    padding: 11px 22px;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 3px 0 var(--amber-dim), 0 6px 14px rgba(232,163,61,0.25);
    transition: transform 0.08s ease;
  }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 1px 0 var(--amber-dim); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  .btn-row { display: flex; justify-content: center; margin-top: 4px; }

  .best-score { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 10px; }

  /* --- playing / revealed --- */
  .statline { display: flex; justify-content: center; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  .screen {
    background: var(--screen);
    border: 1px solid #050403;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5) inset;
    padding: 16px;
    margin-bottom: 18px;
    color: #d7f5c8;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    line-height: 1.7;
    letter-spacing: 0.01em;
  }
  .screen .lbl { color: #5f8a55; }
  .screen.chart-screen { padding: 10px 8px 4px; }
  .screen.chart-screen svg { display: block; }

  .section-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .section { margin-bottom: 18px; }

  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice-btn {
    flex: 1; min-width: 84px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    color: var(--muted);
    font-weight: 700; font-size: 13.5px;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.35);
    transition: all 0.1s ease;
  }
  .choice-btn:hover { color: var(--text); }
  .choice-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  .choice-btn.active-long { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .choice-btn.active-short { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .choice-btn.active-amber { background: rgba(232,163,61,0.14); border-color: var(--amber); color: var(--amber); }

  /* --- reveal --- */
  .reveal { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .verdict-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 5px; }
  .pill.correct { background: var(--green-soft); color: var(--green); }
  .pill.wrong { background: var(--red-soft); color: var(--red); }
  .reveal p { margin: 0; font-size: 13.5px; line-height: 1.65; color: #d8d4cd; }

  /* --- finished --- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; }
  .stat-box .lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat-box .val { font-family: "JetBrains Mono", monospace; font-size: 17px; font-weight: 700; color: var(--text); }

  .callout { border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; font-size: 13px; line-height: 1.65; }
  .callout.pos { background: var(--green-soft); border: 1px solid rgba(63,174,88,0.4); }
  .callout.pos .headline { color: var(--green); font-weight: 700; }
  .callout.neg { background: var(--panel-2); border: 1px solid var(--border); }
  .callout .headline { font-weight: 700; color: var(--text); }
  .callout p { margin: 0; } .callout p + p { margin-top: 4px; color: var(--muted); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 18px; }
  table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 12px; }
  thead { background: var(--panel-2); }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; font-size: 11px; }
  td { padding: 7px 10px; border-top: 1px solid var(--border-soft); font-family: "JetBrains Mono", monospace; }
  td.dim { color: var(--muted-2); font-family: "Noto Sans TC", sans-serif; }
  td.win { color: var(--green); } td.lose { color: var(--red); }

  .footer-note { text-align: center; font-size: 11px; color: var(--muted-2); margin-top: 28px; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="eyebrow"><span class="dot"></span> 訊號執行模擬</div>
    <span class="ig-watermark">@h.e.r_financialdiary</span>
  </div>
  <div class="housing" id="app">
    <span class="rivet-tr"></span><span class="rivet-bl"></span>
  </div>
  <p class="footer-note">本遊戲僅供交易教學與練習使用，情境為模擬生成，不代表真實市場資料，不構成投資建議。</p>
</div>

<script>
(function () {
  "use strict";

  // ---- config ----
  // Pure judgment quiz: given two real candles, is the THIRD candle 陽K (green) or 陰K (red)?
  // No virtual capital, no risk/reward — just right or wrong.
  var ROUNDS_PER_GAME = 10;
  var BEST_SCORE_KEY = "redlight-drill-best-accuracy";

  function colorLabel(c) { return c === "green" ? "陽K" : "陰K"; }
  function isBull(c) { return c.close > c.open; }
  function isBear(c) { return c.close < c.open; }

  // The actual rule (kept out of the visible UI copy on purpose — see per-round reveal text
  // instead, which explains the specific instance without spelling out the general formula):
  // two same-color candles where the second clears the first's high/low -> third continues;
  // two same-color candles that don't clear it -> third flips; two different-color candles
  // (a reversal already happened) -> third just follows the second candle's color.
  function predictThirdColor(A, B) {
    if (isBull(A) && isBull(B)) return B.close > A.high ? "green" : "red";
    if (isBear(A) && isBear(B)) return B.close < A.low ? "red" : "green";
    return isBull(B) ? "green" : "red";
  }

  var CATEGORY_LABELS = {
    "green-breakout": "延續（有效）", "green-no-breakout": "延續（失敗）",
    "red-breakout": "延續（有效）", "red-no-breakout": "延續（失敗）",
    "reversal-to-red": "變盤", "reversal-to-green": "變盤"
  };
  var CATEGORY_EXPLANATIONS = {
    "green-breakout": "前兩根都收漲，且這一根收盤價創了新高，突破前一根的最高點——延續力道還在，第三根通常是",
    "green-no-breakout": "前兩根都收漲，但這一根沒有收在前一根最高點之上——動能不夠力，第三根容易翻成",
    "red-breakout": "前兩根都收跌，且這一根收盤價跌破前一根的最低點——空方力道還在，第三根通常是",
    "red-no-breakout": "前兩根都收跌，但這一根沒有跌破前一根最低點——空方動能不足，第三根容易翻成",
    "reversal-to-red": "前一根收漲、這一根收跌，方向已經轉變——第三根通常會跟著最新這根走，是",
    "reversal-to-green": "前一根收跌、這一根收漲，方向已經轉變——第三根通常會跟著最新這根走，是"
  };

  function shuffle(items, random) {
    var arr = items.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function randRange(min, max, random) { return min + random() * (max - min); }

  function makeCandle(open, close, random) {
    var top = Math.max(open, close), bottom = Math.min(open, close);
    var wickUp = (top - bottom) * randRange(0.15, 0.6, random) + randRange(0.2, 1.5, random);
    var wickDown = (top - bottom) * randRange(0.15, 0.6, random) + randRange(0.2, 1.5, random);
    return { open: open, close: close, high: top + wickUp, low: bottom - wickDown };
  }

  var CANDLE_CATEGORIES = ["green-breakout", "green-no-breakout", "red-breakout", "red-no-breakout", "reversal-to-red", "reversal-to-green"];

  // Builds A/B to deliberately satisfy the named category, with randomized magnitude for
  // variety. The round's correct answer is always re-derived from the actual candle data via
  // predictThirdColor() below, never trusted from the category label directly.
  function generateCandlePair(category, random) {
    var base = randRange(100, 900, random);
    var move = base * randRange(0.03, 0.08, random);
    var A, B, room, extra;

    if (category === "green-breakout" || category === "green-no-breakout") {
      A = makeCandle(base, base + move, random);
      if (category === "green-breakout") {
        extra = Math.max(1, A.high - A.close) * randRange(0.2, 1.2, random) + 1;
        B = makeCandle(A.close, A.high + extra, random);
      } else {
        // Real headroom only — never inflate this, or B.close could accidentally clear A.high
        // and silently flip the round into a breakout despite the category name.
        room = A.high - A.close;
        B = makeCandle(A.close, A.close + randRange(room * 0.3, room * 0.85, random), random);
      }
    } else if (category === "red-breakout" || category === "red-no-breakout") {
      A = makeCandle(base, base - move, random);
      if (category === "red-breakout") {
        extra = Math.max(1, A.close - A.low) * randRange(0.2, 1.2, random) + 1;
        B = makeCandle(A.close, A.low - extra, random);
      } else {
        room = A.close - A.low;
        B = makeCandle(A.close, A.close - randRange(room * 0.3, room * 0.85, random), random);
      }
    } else if (category === "reversal-to-red") {
      A = makeCandle(base, base + move, random);
      B = makeCandle(A.close, A.close - base * randRange(0.03, 0.08, random), random);
    } else {
      A = makeCandle(base, base - move, random);
      B = makeCandle(A.close, A.close + base * randRange(0.03, 0.08, random), random);
    }
    return { A: A, B: B };
  }

  function generateGameRounds(count, random) {
    random = random || Math.random;
    var categories = [];
    for (var i = 0; i < count; i++) categories.push(CANDLE_CATEGORIES[i % CANDLE_CATEGORIES.length]);
    categories = shuffle(categories, random);
    return categories.map(function (cat, i) {
      var pair = generateCandlePair(cat, random);
      return { id: "round-" + i, category: cat, A: pair.A, B: pair.B, correctColor: predictThirdColor(pair.A, pair.B) };
    });
  }

  function resolveRound(input) {
    var round = input.round, playerAnswer = input.playerAnswer;
    var correct = playerAnswer === round.correctColor;
    return { round: round, playerAnswer: playerAnswer, correctAnswer: round.correctColor, correct: correct };
  }

  function summarizeGame(rounds) {
    var correctCount = rounds.filter(function (r) { return r.correct; }).length;
    var longestStreak = 0, currentStreak = 0;
    rounds.forEach(function (r) {
      if (r.correct) { currentStreak += 1; longestStreak = Math.max(longestStreak, currentStreak); }
      else { currentStreak = 0; }
    });

    return {
      roundsPlayed: rounds.length,
      correctCount: correctCount, accuracyPercent: rounds.length > 0 ? (correctCount / rounds.length) * 100 : 0,
      longestStreak: longestStreak
    };
  }

  // ---- formatting ----
  function fmtPct(v) { return Math.round(v) + "%"; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function readBestAccuracy() {
    try { var raw = window.localStorage.getItem(BEST_SCORE_KEY); return raw ? Number(raw) : null; } catch (e) { return null; }
  }
  function writeBestAccuracy(v) {
    try { var cur = readBestAccuracy(); if (cur === null || v > cur) window.localStorage.setItem(BEST_SCORE_KEY, String(v)); } catch (e) {}
  }

  // ---- state ----
  var state = {
    phase: "intro",
    rounds: [],
    roundIndex: 0,
    outcomes: []
  };

  function currentRound() { return state.rounds[state.roundIndex]; }

  function startGame() {
    state.rounds = generateGameRounds(ROUNDS_PER_GAME);
    state.outcomes = [];
    state.roundIndex = 0;
    state.phase = "playing";
    render();
  }

  // The one decision each round: 陽K / 陰K. Picking an answer resolves the round immediately —
  // no separate confirm step.
  function chooseAnswer(answer) {
    var round = currentRound();
    if (!round) return;
    var outcome = resolveRound({ round: round, playerAnswer: answer });
    state.outcomes.push(outcome);
    state.phase = "revealed";
    render();
  }

  function goNext() {
    if (state.roundIndex + 1 >= state.rounds.length) {
      var summary = summarizeGame(state.outcomes);
      writeBestAccuracy(summary.accuracyPercent);
      state.phase = "finished";
      render();
      return;
    }
    state.roundIndex += 1;
    state.phase = "playing";
    render();
  }

  // ---- render ----
  var app = document.getElementById("app");

  function lampRow(activeColor) {
    // activeColor: 'red' | 'green' | null (amber pulses gently as the idle/system lamp).
    // During "playing" this always stays neutral (null) — lighting the real answer's color
    // before the player commits would just be handing them the answer.
    return '<div class="lamp-row">' +
      '<div class="lamp' + (activeColor === "red" ? " lit-red" : "") + '"></div>' +
      '<div class="lamp lit-amber" style="opacity:' + (activeColor ? "0.35" : "1") + '"></div>' +
      '<div class="lamp' + (activeColor === "green" ? " lit-green" : "") + '"></div>' +
      "</div>";
  }

  function renderIntro() {
    var best = readBestAccuracy();
    app.innerHTML =
      '<span class="rivet-tr"></span><span class="rivet-bl"></span>' +
      lampRow(null) +
      '<h1 class="title">指標交易訓練所</h1>' +
      '<p class="subtitle">看兩根K棒，猜第三根是漲是跌——練習你對盤面延續與反轉的判斷力。</p>' +
      '<div class="rules">' +
        '<div class="rule"><span class="num mono">1</span><span>共 ' + ROUNDS_PER_GAME + ' 題，每題會顯示連續兩根K棒。</span></div>' +
        '<div class="rule"><span class="num mono">2</span><span>你要判斷<b>第三根</b>會是<b class="long">陽K（漲）</b>還是<b class="short">陰K（跌）</b>。</span></div>' +
        '<div class="rule"><span class="num mono">3</span><span>答對率越高，代表你越抓得住這套訊號背後的邏輯。</span></div>' +
      "</div>" +
      (best !== null ? '<p class="best-score">歷史最佳正確率：' + fmtPct(best) + "</p>" : "") +
      '<div class="btn-row"><button class="btn-primary" id="start-btn">開始遊戲</button></div>';
    document.getElementById("start-btn").onclick = startGame;
  }

  function svgNum(n) { return Math.round(n * 100) / 100; }

  // Draws the two given candles plus a dashed "?" placeholder (or the real revealed third
  // candle) — and, when A/B share a color, a dashed reference line at A's breakout threshold
  // so it's visually obvious whether B cleared it.
  function buildCandleChart(round, revealColor) {
    var A = round.A, B = round.B;
    var width = 320, plotH = 168, padTop = 14, padBottom = 10, labelY = plotH + 18;
    var cxA = 68, cxB = 160, cxQ = 252;

    // When revealing, synthesize real OHLC for the third candle instead of a static block:
    // it opens at B's close and its own close is built to land strictly beyond B's close in
    // the answer's direction, so it genuinely closes higher (陽K) or lower (陰K) than B.
    var C = null;
    if (revealColor) {
      var bodyRef = Math.abs(B.close - B.open) || (B.high - B.low) * 0.3 || 1;
      var move = Math.max(bodyRef * 0.6, (B.high - B.low) * 0.35, 1);
      var cOpen = B.close;
      var cClose = revealColor === "green" ? cOpen + move : cOpen - move;
      C = makeCandle(cOpen, cClose, Math.random);
    }

    var lo = Math.min(A.low, B.low), hi = Math.max(A.high, B.high);
    if (C) { lo = Math.min(lo, C.low); hi = Math.max(hi, C.high); }
    var span = Math.max(1e-6, hi - lo);
    function y(price) { return padTop + (hi - price) / span * (plotH - padTop - padBottom); }
    function candle(c, cx) {
      var color = isBull(c) ? "#3fae58" : "#e2483d";
      var top = y(Math.max(c.open, c.close)), bottom = y(Math.min(c.open, c.close));
      var h = Math.max(5, bottom - top); // visual floor only — never affects which candle wins or the logic
      return '<line x1="' + cx + '" y1="' + svgNum(y(c.high)) + '" x2="' + cx + '" y2="' + svgNum(y(c.low)) + '" stroke="' + color + '" stroke-width="2.5"/>' +
        '<rect x="' + svgNum(cx - 23) + '" y="' + svgNum(top) + '" width="46" height="' + svgNum(h) + '" fill="' + color + '" rx="2"/>';
    }

    var refLine = "";
    if (isBull(A) && isBull(B)) {
      var refYUp = svgNum(y(A.high));
      refLine = '<line x1="' + (cxA - 23) + '" y1="' + refYUp + '" x2="' + (cxB + 26) + '" y2="' + refYUp + '" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.9"/>';
    } else if (isBear(A) && isBear(B)) {
      var refYDown = svgNum(y(A.low));
      refLine = '<line x1="' + (cxA - 23) + '" y1="' + refYDown + '" x2="' + (cxB + 26) + '" y2="' + refYDown + '" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.9"/>';
    }

    var thirdBlock;
    if (revealColor && C) {
      thirdBlock = candle(C, cxQ);
    } else {
      var midY = (y(Math.max(A.open, A.close, B.open, B.close)) + y(Math.min(A.open, A.close, B.open, B.close))) / 2;
      thirdBlock = '<rect x="' + (cxQ - 23) + '" y="' + svgNum(midY - 20) + '" width="46" height="40" fill="none" stroke="#6f6a68" stroke-width="2" stroke-dasharray="5,4" rx="4"/>' +
        '<text x="' + cxQ + '" y="' + svgNum(midY + 6) + '" text-anchor="middle" font-size="20" font-weight="700" fill="#8a8480">?</text>';
    }
    return '<svg viewBox="0 0 ' + width + " " + (plotH + 26) + '" width="100%" height="' + (plotH + 26) + '" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans TC, sans-serif">' +
      refLine + candle(A, cxA) + candle(B, cxB) + thirdBlock +
      '<text x="' + cxA + '" y="' + labelY + '" text-anchor="middle" font-size="11" fill="#6f6a68">前一根</text>' +
      '<text x="' + cxB + '" y="' + labelY + '" text-anchor="middle" font-size="11" fill="#6f6a68">這一根</text>' +
      '<text x="' + cxQ + '" y="' + labelY + '" text-anchor="middle" font-size="11" fill="#6f6a68">第三根？</text>' +
      "</svg>";
  }

  function renderPlaying() {
    var round = currentRound();

    var html =
      '<span class="rivet-tr"></span><span class="rivet-bl"></span>' +
      lampRow(null) +
      '<div class="statline"><span>第 ' + (state.roundIndex + 1) + " / " + state.rounds.length + ' 題</span></div>' +
      '<div class="screen chart-screen">' + buildCandleChart(round, null) + "</div>" +
      '<div class="section"><div class="section-label">第三根會是？</div><div class="choice-row" id="answer-row">' +
        '<button class="choice-btn" data-answer="green">陽K（漲）</button>' +
        '<button class="choice-btn" data-answer="red">陰K（跌）</button>' +
      "</div></div>";

    app.innerHTML = html;

    app.querySelectorAll("#answer-row .choice-btn").forEach(function (btn) {
      btn.onclick = function () { chooseAnswer(btn.getAttribute("data-answer")); };
    });
  }

  function renderRevealed() {
    var round = currentRound();
    var outcome = state.outcomes[state.outcomes.length - 1];
    var isLast = state.roundIndex + 1 >= state.rounds.length;

    var bodyText = CATEGORY_EXPLANATIONS[round.category] + "<b style=\"color:" +
      (round.correctColor === "green" ? "var(--green)" : "var(--red)") + "\">" + colorLabel(round.correctColor) + "</b>。" +
      (outcome.correct ? " 你判斷對了。" : " 這題判斷錯誤。");

    var html =
      '<span class="rivet-tr"></span><span class="rivet-bl"></span>' +
      lampRow(round.correctColor) +
      '<div class="statline"><span>第 ' + (state.roundIndex + 1) + " / " + state.rounds.length + ' 題</span></div>' +
      '<div class="screen chart-screen">' + buildCandleChart(round, round.correctColor) + "</div>" +
      '<div class="reveal">' +
        '<div class="verdict-row"><span class="pill ' + (outcome.correct ? "correct" : "wrong") + '">' + (outcome.correct ? "判斷正確" : "判斷錯誤") + "</span>" +
          '<span style="color:var(--muted)">你選了 <b style="color:var(--text)">' + colorLabel(outcome.playerAnswer) + "</b>，正確答案是 <b style=\"color:var(--text)\">" + colorLabel(outcome.correctAnswer) + "</b></span></div>" +
        "<p>" + bodyText + "</p>" +
        '<div class="btn-row" style="justify-content:flex-start"><button class="btn-primary" id="next-btn">' + (isLast ? "查看結算" : "下一題") + "</button></div>" +
      "</div>";

    app.innerHTML = html;
    document.getElementById("next-btn").onclick = goNext;
  }

  function renderFinished() {
    var summary = summarizeGame(state.outcomes);
    // Pass bar matches this rule combo's real historical win rate (~70%), so "passing" the
    // quiz means reading price action about as well as the actual strategy does.
    var passed = summary.accuracyPercent >= 70;
    var rows = state.outcomes.map(function (o, i) {
      return "<tr><td class=\"dim\">" + (i + 1) + "</td>" +
        "<td class=\"dim\">" + CATEGORY_LABELS[o.round.category] + "</td>" +
        "<td>" + colorLabel(o.correctAnswer) + "</td>" +
        "<td class=\"" + (o.correct ? "win" : "lose") + "\">" + colorLabel(o.playerAnswer) + "</td>" +
        "<td class=\"" + (o.correct ? "win" : "lose") + "\">" + (o.correct ? "✓ 答對" : "✕ 答錯") + "</td></tr>";
    }).join("");

    var html =
      '<span class="rivet-tr"></span><span class="rivet-bl"></span>' +
      lampRow(passed ? "green" : "red") +
      '<h1 class="title" style="font-size:24px">結算</h1>' +
      '<div class="stat-grid">' +
        '<div class="stat-box"><div class="lbl">判斷正確率</div><div class="val">' + summary.correctCount + "/" + summary.roundsPlayed + " (" + fmtPct(summary.accuracyPercent) + ")</div></div>" +
        '<div class="stat-box"><div class="lbl">最長連續答對</div><div class="val">' + summary.longestStreak + " 題</div></div>" +
      "</div>" +
      (passed
        ? '<div class="callout pos"><p class="headline">恭喜，你的判斷力很不錯，很適合這樣的策略跟指標！</p><p>想領取指標，或想學習如何使用，直接私訊「想領取指標」。</p></div>'
        : '<div class="callout neg"><p class="headline">沒關係，現在只是你還沒搞懂指標跟策略的運用。</p><p>我們的課程都有免費教學，學習完可以再來重新測驗，直接私訊「想學習系統化課程」。</p></div>') +
      '<div class="table-wrap"><table><thead><tr><th>#</th><th>型態</th><th>正確答案</th><th>你的判斷</th><th>結果</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="btn-row"><button class="btn-primary" id="restart-btn">重新挑戰</button></div>';

    app.innerHTML = html;
    document.getElementById("restart-btn").onclick = startGame;
  }

  function render() {
    if (state.phase === "intro") renderIntro();
    else if (state.phase === "playing") renderPlaying();
    else if (state.phase === "revealed") renderRevealed();
    else if (state.phase === "finished") renderFinished();
  }

  render();
})();
</script>
</body>
</html>
